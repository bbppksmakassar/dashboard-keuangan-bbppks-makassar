name: Update history.json

# Berjalan setiap realisasi.pdf / ikpa.pdf di-push (atau manual lewat tab Actions).
on:
  push:
    paths:
      - "realisasi.pdf"
      - "ikpa.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install pdfjs-dist@3.11.174 --no-save
      - run: node scripts/update-history.mjs
      - name: Commit history.json
        run: |
          if [ -n "$(git status --porcelain history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json
            git commit -m "Update history.json"
            git push
          else
            echo "history.json tidak berubah"
          fi
